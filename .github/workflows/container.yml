name: Container

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: website:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run hardened image
        run: |
          docker run --detach --name website \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --tmpfs /app/.next/cache:rw,noexec,nosuid,nodev,size=256m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --publish 127.0.0.1:3000:3000 \
            website:pr

      - name: Smoke public routes
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:3000/health
          curl --fail --silent --show-error http://127.0.0.1:3000/ | grep --quiet "Andrei Iacob"
          curl --fail --silent --show-error http://127.0.0.1:3000/about | grep --quiet "About Andrei Iacob"
          curl --fail --silent --show-error http://127.0.0.1:3000/homelab | grep --quiet "I host what I build"

      - name: Container logs
        if: always()
        run: docker logs website

      - name: Remove container
        if: always()
        run: docker rm --force website
