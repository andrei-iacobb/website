services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - portfolio_node_modules:/app/node_modules
      - portfolio_next:/app/.next
    init: true

volumes:
  portfolio_node_modules:
  portfolio_next:
